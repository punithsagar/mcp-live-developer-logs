services:
  mcp-log-server:
    build: .
    container_name: mcp-log-server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LOG_FILE: /app/logs/app.jsonl
      LOG_MAX_FILE_SIZE: 1048576
      LOG_MAX_BACKUPS: 5
      METRICS_CACHE_MAX_AGE_MS: 5000
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped